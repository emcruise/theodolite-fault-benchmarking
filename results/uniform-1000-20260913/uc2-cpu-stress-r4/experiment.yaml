apiVersion: ecoscape.cau-se.de/v1alpha1
kind: Experiment
metadata:
  name: measure-uc2-cpu-stress-1f31412f
  namespace: default
spec:
  topologyRef: {name: two-zone-edge}
  chaosPhaseRef: {name: measure-uc2-cpu-stress-1f31412f-fault}
  manifests:
    sut: {configMapRef: {name: measure-uc2-cpu-stress-1f31412f-sut}}
    load: {configMapRef: {name: measure-uc2-cpu-stress-1f31412f-load}}
    monitor: {configMapRef: {name: measure-uc2-cpu-stress-1f31412f-monitor}}
  duration:
    topologyDelay: 15
    loadDelay: 60
    chaosDelay: 150
    measurementDuration: 120
    measurementSampleInterval: 5
    repetitions: 1
    pauseBetweenRepetitions: 90
  prometheus:
    url: "http://kube1-1:30093"
    queryTimeoutSeconds: 10
  slos:
    - name: input-consumerlag
      query: 'sum(clamp_min(kafka_consumergroup_lag{consumergroup="theodolite-uc2-application-0.0.1",topic="input",job="monitoring/kafka-pod-monitor-series"},0))'
      threshold: 50000
      isBiggerBetter: false
      weight: 1.0
