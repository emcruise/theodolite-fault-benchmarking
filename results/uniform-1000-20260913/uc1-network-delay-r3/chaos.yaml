# =============================================================================
# ChaosPhase des Referenzszenarios. Inhaltlich unveraendert gegenueber der alten
# chaosphase.yaml (Laeufe spsgy/fezsk/ryjmu/yjmgj), nur umbenannt:
#   esp-network-degraded-munich -> esp-uc1-network-delay
#   esp-munich-broker-delay     -> fault-uc1-network-delay
#
# ABWEICHUNG 3 vom Original (type: NetworkDelay, zones: [munich, cloud]):
# Der Datenpfad von UC1 ist  Loadgen (cloud) -> Kafka (ns kafka) -> SUT (munich).
# Loadgen und SUT reden NIE direkt miteinander; der Consumer-Lag haengt allein an
# der Strecke SUT <-> Broker. Eine Zone-zu-Zone-Regel laesst genau diese Strecke
# unberuehrt (belegt durch Lauf flfjz am 09.09.2026). Kafka liegt in ns 'kafka',
# gehoert keiner Zone an und ist ueber 'zones' nicht adressierbar.
#
# Selector:  alle Pods der Zone munich mit ecoscape-Label (= SUT + probe-munich).
# Target:    nur die drei Strimzi-Broker (entity-operator und kafka-exporter
#            tragen das Label strimzi.io/name=kafka-cluster-kafka NICHT).
# direction: both -> Produce- und Fetch-Richtung.
# =============================================================================
apiVersion: ecoscape.cau-se.de/v1alpha1
kind: ChaosPhase
metadata:
  name: measure-uc1-network-delay-857c37a7-fault
  namespace: default
spec:
  topologyRef:
    name: two-zone-edge
  faults:
    - type: Custom
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: NetworkChaos
        metadata:
          name: fault-uc1-network-delay
          namespace: default          # muss explizit stehen, Ecoscape injiziert nichts
        spec:
          action: delay
          mode: all
          selector:
            namespaces:
              - two-zone-edge-munich
            labelSelectors:
              ecoscape: "true"
          direction: both
          target:
            mode: all
            selector:
              namespaces:
                - kafka
              labelSelectors:
                strimzi.io/name: kafka-cluster-kafka
          delay:
            latency: "500ms"
            jitter: "100ms"
            correlation: "100"
